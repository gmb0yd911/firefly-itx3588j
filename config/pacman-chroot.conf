# Pacman configuration customized for QEMU aarch64 chroot environments
# DisableSandboxFilesystem and DisableSandboxSyscalls prevent Landlock seccomp
# restrictions from aborting transactions under user-mode emulation.

[options]
HoldPkg     = pacman glibc
Architecture = aarch64

Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

DisableSandboxFilesystem
DisableSandboxSyscalls

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
